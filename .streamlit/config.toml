# ============================================================================
# Streamlit configuration
# ============================================================================
# Settings tuned for both local development and Streamlit Community Cloud.
# The app's visual styling is in inline CSS within ui_protocol.py and app.py;
# this file controls page chrome and runtime behavior.

[theme]
base = "light"
primaryColor = "#1f2937"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f9fafb"
textColor = "#111827"

[server]
# headless = true is required for cloud deployment; the Linux server has
# no browser to open. This also works locally — Streamlit prints the URL
# to the terminal instead of auto-opening a browser.
headless = true
runOnSave = false

[browser]
# Suppress the first-run telemetry prompt that can block boot on
# fresh cloud deployments.
gatherUsageStats = false

[client]
# Suppress the "Made with Streamlit" footer in production.
toolbarMode = "minimal"